# JuvorAI Docker Compose Configuration
# Based on New API (https://github.com/QuantumNous/new-api)
#
# Quick Start:
#   1. cp .env.juvorai.example .env   # optional: customize env
#   2. docker compose up -d
#   3. Access at http://localhost:3000
#
# ⚠️  IMPORTANT: Change all default passwords before deploying to production!

version: '3.4'

services:
  juvorai:
    image: calciumion/new-api:latest
    container_name: juvorai
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:123456@postgres:5432/juvorai
      - REDIS_CONN_STRING=redis://:123456@redis:6379
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=juvorai-node-1
#      - SESSION_SECRET=change_this_to_a_random_string_in_production
    depends_on:
      - redis
      - postgres
    networks:
      - juvorai-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: juvorai-redis
    restart: always
    command: ["redis-server", "--requirepass", "123456"]
    networks:
      - juvorai-network

  postgres:
    image: postgres:15
    container_name: juvorai-postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: juvorai
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - juvorai-network

volumes:
  pg_data:

networks:
  juvorai-network:
    driver: bridge
